---
name: CI and publish

on:
  push:
    branches:
      - master
    paths:
      - "homebox-mcp/**"
      - ".github/workflows/**"

permissions: {}

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yaml

  information:
    name: Gather add-on version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read version from config
        id: metadata
        shell: bash
        run: |
          VERSION="$(awk -F '"' '/^version:/ { print $2; exit }' homebox-mcp/config.yaml)"
          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not read version from homebox-mcp/config.yaml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Add-on version: $VERSION"

  build:
    if: github.event_name == 'push'
    needs:
      - ci
      - information
    name: Build & push ${{ matrix.architecture }}
    runs-on: ${{ matrix.architecture == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
          - architecture: aarch64
            platform: linux/arm64/v8

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build date
        id: metadata
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: homebox-mcp
          file: homebox-mcp/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/kf042020/homebox-mcp:${{ github.sha }}-${{ matrix.architecture }}
          cache-from: type=gha,scope=${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ matrix.architecture }}
          build-args: |
            BUILD_ARCH=${{ matrix.architecture }}
            BUILD_DATE=${{ steps.metadata.outputs.date }}
            BUILD_DESCRIPTION=Homebox MCP with native Home Assistant discovery for OpenAI and Gemini
            BUILD_FROM=ghcr.io/hassio-addons/base:19.0.0
            BUILD_NAME=Homebox MCP Server
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=KF042020/homebox-mcp
            BUILD_VERSION=${{ needs.information.outputs.version }}

  manifest:
    if: github.event_name == 'push'
    name: Create multi-architecture image
    needs:
      - build
      - information
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-architecture manifest
        env:
          IMAGE: ghcr.io/kf042020/homebox-mcp
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.information.outputs.version }}
        run: |
          docker buildx imagetools create --tag "${IMAGE}:dev" --tag "${IMAGE}:${VERSION}" "${IMAGE}:${SHA}-amd64" "${IMAGE}:${SHA}-aarch64"
