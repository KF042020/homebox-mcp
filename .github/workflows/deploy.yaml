---
name: Publish Add-on Images

on:
  push:
    branches:
      - master
    paths:
      - "homebox-mcp/**"
      - ".github/workflows/deploy.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-homebox-mcp-images
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.arch }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read add-on version
        id: metadata
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version: "\\(.*\\)"/\\1/p' homebox-mcp/config.yaml)"
          if [[ -z "$VERSION" ]]; then
            echo "Could not read version from homebox-mcp/config.yaml" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./homebox-mcp
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/kf042020/homebox-mcp-${{ matrix.arch }}:${{ steps.metadata.outputs.version }}
            ghcr.io/kf042020/homebox-mcp-${{ matrix.arch }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/KF042020/homebox-mcp
            org.opencontainers.image.description=Homebox MCP Server for Home Assistant
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            BUILD_DESCRIPTION=Homebox MCP with native Home Assistant MCP discovery
            BUILD_NAME=Homebox MCP Server
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=KF042020/homebox-mcp
            BUILD_VERSION=${{ steps.metadata.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
