---
name: "Homebox MCP Server"
description: "Homebox MCP with native Home Assistant discovery for OpenAI and Gemini"
version: "0.7.3"
slug: "homebox-mcp"
url: "https://github.com/KF042020/homebox-mcp"
# Pull the prebuilt multi-architecture GHCR manifest published by GitHub Actions.
# Supervisor downloads the matching image; it never builds this add-on on the HA host.
image: ghcr.io/kf042020/homebox-mcp
init: false
arch:
  - amd64
  - aarch64
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "MCP Server SSE endpoint"
ingress: true
ingress_stream: true
# Allow the add-on to register its MCP endpoint with Home Assistant via Supervisor.
hassio_api: true
discovery:
  - mcp
panel_icon: "mdi:package-variant-closed"
panel_title: "Homebox MCP"
options:
  homebox_url: "http://homeassistant.local:7745"
  homebox_token: ""
  mcp_auth_enabled: false
  mcp_auth_token: ""
  log_level: "info"
schema:
  homebox_url: str
  homebox_token: str
  mcp_auth_enabled: bool
  mcp_auth_token: str?
  log_level: list(trace|debug|info|warning|error)
